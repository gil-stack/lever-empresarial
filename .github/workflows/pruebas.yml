name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

jobs:
  suite:
    name: Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dueno
          POSTGRES_PASSWORD: dueno
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dueno -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AISLAMIENTO_DATABASE_URL: postgres://dueno:dueno@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
